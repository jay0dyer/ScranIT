<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scran</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='master.css') }}">
      <link rel="stylesheet" href="{{ url_for('static', filename='search.css') }}">
      <link rel="shortcut icon" href="{{ url_for('static', filename='Images/favicon.ico') }}">
  </head>
  <body>
    <nav class="navbar">
        <div class="nav-links">
            <a href={{ url_for('landing_page') }}>Home</a>
            <a href={{ url_for('search') }}>Search</a>
            <a href={{ url_for('AboutUs') }}>About us</a>
        </div>
    </nav>
    <H1>Welcome to scranIT!</H1>
    <H1>[PROTOTYPE]</H1>
    <form action="/search" method="GET", id="searchbox">
        <input name="text" placeholder="What are you scranning for?">
        <select name="sortBy">
            <option value="Relevance">Relevance</option>
            <option value="PriceLTH">Price, Low to High</option>
            <option value="PriceHTL">Price, High to Low</option>
        </select>
        <button type="submit">Search NE1</button>
    </form>
    <div class="cards-container">
        {% for result in result %}
        <div class="food-card">
            <!-- Top Section: Image on left, Name/Price & Description on right -->
            <div class="card-top">
                <div class="card-img-wrapper">
                    <img src="{{ result['Image'] }}" alt="{{ result['Restaurant']}} Logo" class="card-img">
                </div>

                <div class="card-details">
                    <div class="title-price">
                        <h3 class="card-title">{{ result['Item']}}</h3>
                        <span class="card-price">{{ result['Price']}}</span>
                    </div>
                    <p class="card-desc">{{ result['Description']}}</p>
                </div>
            </div>

            <!-- Bottom Section: Address and Google Maps Link -->
            <div class="card-bottom">
                <p class="card-address">{{ result['Postcode']}}, {{ result['StreetAddress']}}</p>
                <a href="https://www.google.com/maps/search/?api=1&query={{ (result['Restaurant'] ~ ' ' ~ result['StreetAddress'] ~ ' ' ~ result['Postcode']) | urlencode }}" target="_blank" rel="noopener noreferrer" class="map-link">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRDU1sL0vmcpPZfHKaZctSPz2LRUJHtpoIIgdPp7_0vjg&s=10" alt="View on google maps" width="40">
                </a>
            </div>
        </div>
        {% endfor %}
    </div>
    <script src="index.js"></script>
  </body>
</html>
